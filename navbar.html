
<!DOCTYPE html>
<html>
<head>
    <title>Aura Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background: #b000cc;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            position: sticky;
            top: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 5px;
        }

        nav a:hover {
            background: purple;
        }

        .hero {
            background: linear-gradient(to right, #ed008c, #7200ff);
            color: white;
            text-align: center;
            height: 260px;
            padding-top: 25px;
        }

        .content {
            padding: 30px;
            height: 150px;
        }
    </style>
</head>

<body>

    <nav>
        <b style="color:white;">Aura</b>

        <div>
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#gallery">Gallery</a>
            <a href="#signin">Sign In</a>
        </div>
    </nav>

    <div class="hero" id="home">
        <h3>Glassmorphism in Action</h3>
        <p>Scroll down to see the frosted glass effect.</p>
    </div>

    <div class="content" id="features">
        <h3>Features</h3>
        <p>Welcome to the Features section.</p>
    </div>

    <div class="content" id="gallery">
        <h3>Gallery</h3>
        <p>Welcome to the Gallery section.</p>
    </div>

    <div class="content" id="signin">
        <h3>Sign In</h3>
        <p>Welcome to the Sign In section.</p>
    </div>

</body>
</html>
